<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ITDer Telemetry Live Logs</title>
  <style>
    :root {
      /* Dashboard Dark Mode Variables */
      --bg:            #0f1117;
      --bg-card:       #181c25;
      --bg-subtle:     #1e2330;
      --bg-hover:      #1e2330;
      --border:        #272d3d;
      --border-soft:   #1e2330;
      --text:          #e2e8f0;
      --text-2:        #94a3b8;
      --text-3:        #64748b;
      --text-4:        #3d4a5c;
      --accent:        #818cf8;
      --accent-soft:   #1e2040;
      --accent-border: #3730a3;
      --red:           #f87171;
      --red-soft:      #1f1010;
      --red-border:    #7f1d1d;
      --amber:         #fbbf24;
      --green:         #34d399;
      --shadow:        0 1px 3px rgba(0,0,0,.3);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      margin: 0;
      padding: 0;
    }

    .dash {
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
      padding: 24px 32px 64px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 24px;
    }

    .header {
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .header h1 {
      font-size: 20px;
      font-weight: 600;
      margin: 0;
    }

    .header p {
      font-size: 14px;
      color: var(--text-3);
      margin-top: 4px;
      margin-bottom: 0;
    }

    #log-container {
      display: flex;
      flex-direction: column;
      font-family: 'Courier New', Courier, monospace;
      font-size: 14px;
    }

    .log-line {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border-soft);
      word-wrap: break-word;
      line-height: 1.4;
    }
    .log-line:last-child {
      border-bottom: none;
    }
    .log-line:hover {
      background: var(--bg-hover);
    }

    .ts { color: var(--text-3); margin-right: 8px; }
    
    .source { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 600; 
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 4px;
      margin-right: 12px;
      display: inline-block;
      min-width: 65px;
      text-align: center;
    }
    
    .source.agent { background: var(--bg-subtle); color: var(--amber); border: 1px solid var(--border); }
    .source.api   { background: var(--accent-soft); color: var(--accent); border: 1px solid var(--accent-border); }
    .source.worker{ background: rgba(52, 211, 153, 0.1); color: var(--green); border: 1px solid rgba(52, 211, 153, 0.2); }

    .msg { color: var(--text); }
  </style>
</head>
<body>
  <div class="dash">
    <div class="card">
      <div class="header">
        <h1>Live Telemetry Stream</h1>
        <p>Real-time execution logs from the distributed pipeline.</p>
      </div>
      <div id="log-container"></div>
    </div>
  </div>

  <script>
    const container = document.getElementById('log-container');
    const streamUrl = 'http://localhost:8000/api/telemetry_stream';
    const evtSource = new EventSource(streamUrl);

    evtSource.onmessage = function(event) {
      const logs = JSON.parse(event.data);
      if (logs.length > 0) {
        // Reverse so the absolute newest log in the batch is inserted last at the very top
        logs.reverse().forEach(log => {
          const div = document.createElement('div');
          div.className = 'log-line';
          div.innerHTML = `<span class="ts">[${log.timestamp}]</span> <span class="source ${log.source}">${log.source.toUpperCase()}</span> <span class="msg">${log.message}</span>`;
          container.prepend(div);
        });
      }
    };

    evtSource.onerror = function() {
      const div = document.createElement('div');
      div.className = 'log-line';
      div.innerHTML = `<span style="color: var(--red);">Connection to telemetry stream lost. Retrying...</span>`;
      container.prepend(div);
    };
  </script>
</body>
</html>
