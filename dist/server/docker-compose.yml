services:
  postgres:
    build:
      context: https://github.com/rakuda04/ITDer.git#main:dist/server
      dockerfile: Dockerfile.postgres
    container_name: itder_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: itder
      POSTGRES_USER: itder_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password} 
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itder_user -d itder"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    build:
      context: https://github.com/rakuda04/ITDer.git#main:dist/server
      dockerfile: Dockerfile.pgadmin
    container_name: itder_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@itder.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-password}
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    ports:
      - "5050:80"
    depends_on:
      - postgres

  api:
    build:
      context: https://github.com/rakuda04/ITDer.git#main:dist/server
      dockerfile: Dockerfile.api
    container_name: itder_api
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: itder
      POSTGRES_USER: itder_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: https://github.com/rakuda04/ITDer.git#main:dist/server
      dockerfile: Dockerfile.worker
    container_name: itder_worker
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: itder
      POSTGRES_USER: itder_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      ITDER_SCHEDULE: "0"  
      ITDER_CRON: "0 2 * * *"  
    depends_on:
      postgres:
        condition: service_healthy

  dashboard:
    build:
      context: https://github.com/rakuda04/ITDer.git#main:dist/server
      dockerfile: Dockerfile.dashboard
    container_name: itder_dashboard
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: itder
      POSTGRES_USER: itder_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "5001:5000"
    depends_on:
      postgres:
        condition: service_healthy

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: itder_cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - api
    profiles:
      - tunnel  
volumes:
  postgres_data: